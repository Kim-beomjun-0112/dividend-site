name: 배당 데이터 주간 갱신

on:
  schedule:
    - cron: '30 21 * * 0'   # 매주 월요일 06:30 KST (일요일 21:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: 금융위 배당정보 (선택, 키 없으면 건너뜀)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch_fsc.js || true
      - name: 국내 수집
        run: node scripts/fetch_kr.js all
      - name: 미국 수집
        run: node scripts/fetch_us.js all
      - name: 사이트 데이터 빌드
        run: node scripts/build.js
      - name: 커밋 & 푸시
        run: |
          git config user.name "dividend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%d) 주간 갱신"
          git push
